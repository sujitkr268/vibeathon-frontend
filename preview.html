/* ---------- THREE.JS LOTUS ---------- */
function LotusThree() {
  const mount = useRef(null);
  const state = useRef({ hovered:false, scale:1, targetScale:1 });
  useEffect(() => {
    const el = mount.current;
    if (!el || !THREE) return;
    const w = el.clientWidth, h = el.clientHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
    camera.position.set(0,0,5);
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(w, h);
    el.appendChild(renderer.domElement);

    const amb = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(amb);
    const pl1 = new THREE.PointLight(0xD4AF37, 1);
    pl1.position.set(10,10,10); scene.add(pl1);
    const pl2 = new THREE.PointLight(0xC97D5B, 0.5);
    pl2.position.set(-10,-10,-10); scene.add(pl2);

    const geo = new THREE.TorusKnotGeometry(1, 0.35, 128, 32);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xC97D5B, metalness: 0.95, roughness: 0.15, emissive: 0x000000, emissiveIntensity: 0
    });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const onMove = (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(mesh);
      const on = hits.length > 0;
      state.current.targetScale = on ? 1.3 : 1;
      mat.color.setHex(on ? 0xD4AF37 : 0xC97D5B);
      mat.emissive.setHex(on ? 0xD4881C : 0x000000);
      mat.emissiveIntensity = on ? 0.4 : 0;
    };
    renderer.domElement.addEventListener('pointermove', onMove);
    renderer.domElement.style.cursor = 'pointer';

    const onResize = () => {
      const w2 = el.clientWidth, h2 = el.clientHeight;
      renderer.setSize(w2, h2);
      camera.aspect = w2/h2; camera.updateProjectionMatrix();
    };
    window.addEventListener('resize', onResize);

    let raf;
    const animate = () => {
      raf = requestAnimationFrame(animate);
      state.current.scale += (state.current.targetScale - state.current.scale) * 0.08;
      mesh.scale.setScalar(state.current.scale);
      mesh.rotation.x += 0.004;
      mesh.rotation.y += 0.006;
      renderer.render(scene, camera);
    };
    animate();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', onResize);
      renderer.domElement.removeEventListener('pointermove', onMove);
      renderer.dispose(); geo.dispose(); mat.dispose();
      if (renderer.domElement.parentNode === el) el.removeChild(renderer.domElement);
    };
  }, []);
  return <div ref={mount} id="three-canvas-wrap" className="w-full h-full" />;
}

    if (!item.isAvailable) return;
    setCart(prev => {
      const ex = prev.find(c => c.menuItemId === item.id);
      if (ex) return prev.map(c => c.menuItemId === item.id ? {...c, quantity: c.quantity+1} : c);
      return [...prev, { menuItemId:item.id, name:item.name, price:item.price, quantity:1 }];
    });
  };

    if (cart.length === 0) return;

      id: Date.now(),
      tableNumber: Math.floor(Math.random()*15)+1,
      items: cart.map(c => ({ menuItemId:c.menuItemId, name:c.name, quantity:c.quantity, price:c.price })),
      status: 'pending', total: cartTotal,
      timestamp: new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
    };
    setOrders(prev => [...prev, newOrder]);
    setCart([]); setCartOpen(false);
    setNotifications(prev => [`Order #${newOrder.id} placed successfully!`, ...prev].slice(0,5));
    setOrderMsg('Order placed! Check the Kitchen view for status.');
    setTimeout(() => setOrderMsg(''), 4000);
  };

                        </div>
                        <div className="space-y-5">
                          <div className="p-5 rounded-luxury bg-charcoal/60 border border-deepSaffron/30 backdrop-blur-sm">
                            <div className="flex items-center gap-2 mb-3">
                              <span className="text-deepSaffron text-lg">📈</span>
                              <h4 className="font-playfair text-lg text-warmwhite">Demand Forecast</h4>
                            </div>
                            <p className="text-softBeige/80 leading-relaxed">
                              <strong className="text-terracotta">Saffron Risotto</strong> stock is depleting fast.
                              Based on weekend trends, <strong className="text-royalGold">86 incidents</strong> will
                              occur by <strong className="text-royalGold">8 PM</strong>.
                              Recommend <span className="bg-oliveGreen/30 px-2 py-0.5 rounded text-oliveGreen border border-oliveGreen/40">increasing prep by 30%</span>.
                            </p>
                          </div>
                          <div className="p-5 rounded-luxury bg-charcoal/60 border border-royalGold/30 backdrop-blur-sm">
                            <div className="flex items-center gap-2 mb-3">
                              <span className="text-royalGold text-lg">💡</span>
                              <h4 className="font-playfair text-lg text-warmwhite">Personalized Recommendation</h4>
                            </div>
                            <p className="text-softBeige/80 leading-relaxed">
                              Customers who order <strong className="text-terracotta">Makhani Lamb</strong> have a{' '}
                              <strong className="text-royalGold text-xl">80%</strong> chance of ordering{' '}
                              <strong className="text-terracotta">Mango Lassi</strong>.
                              Suggest <span className="bg-deepSaffron/30 px-2 py-0.5 rounded text-deepSaffron border border-deepSaffron/40">bundling them</span> to
                              increase average order value by an estimated 18%.
                            </p>
                          </div>
                          <div className="grid grid-cols-3 gap-4 mt-4">
                            <div className="p-4 rounded-luxury bg-gradient-to-br from-royalGold/20 to-transparent border border-royalGold/30 text-center">
                              <p className="text-3xl mb-1">⚡</p>
                              <p className="font-playfair text-2xl text-royalGold">+18%</p>
                              <p className="text-xs text-softBeige/60">Projected Revenue Lift</p>
                            </div>
                            <div className="p-4 rounded-luxury bg-gradient-to-br from-terracotta/20 to-transparent border border-terracotta/30 text-center">
                              <p className="text-3xl mb-1">🎯</p>
                              <p className="font-playfair text-2xl text-terracotta">96%</p>
                              <p className="text-xs text-softBeige/60">Model Confidence</p>
                            </div>
                            <div className="p-4 rounded-luxury bg-gradient-to-br from-oliveGreen/20 to-transparent border border-oliveGreen/30 text-center">
                              <p className="text-3xl mb-1">💎</p>
                              <p className="font-playfair text-2xl text-oliveGreen">Platinum</p>
                              <p className="text-xs text-softBeige/60">Your Tier</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        )}
      </main>

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-[100] flex">
          <div className="absolute inset-0 bg-charcoal/80 backdrop-blur-sm" onClick={() => setCartOpen(false)} />
          <div className="relative ml-auto w-full max-w-md h-full bg-gradient-to-b from-darkWalnut to-charcoal border-l border-softBeige/15 shadow-2xl flex flex-col">
            <div className="p-6 border-b border-softBeige/10 flex items-center justify-between">
              <div>
                <h3 className="font-playfair text-2xl text-royalGold">Your Cart</h3>
                <p className="text-xs text-softBeige/60">{cartCount} items</p>
              </div>
              <button onClick={() => setCartOpen(false)}
                className="w-10 h-10 rounded-full bg-smokyGray/60 hover:bg-smokyGray flex items-center justify-center transition-colors">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto p-6 space-y-4">
              {cart.length === 0 ? (
                <div className="text-center py-16">
                  <div className="text-6xl mb-4">🍽️</div>
                  <p className="text-softBeige/60">Your cart is empty</p>
                  <p className="text-xs text-softBeige/40 mt-1">Add some luxury delights from the menu</p>
                </div>
              ) : (
                cart.map(item => (
                  <div key={item.menuItemId} className="flex items-center gap-4 p-4 rounded-luxury bg-smokyGray/40 border border-softBeige/10">
                    <div className="flex-1">
                      <p className="font-medium text-warmwhite">{item.name}</p>
                      <p className="text-xs text-softBeige/60">${item.price} × {item.quantity}</p>
                    </div>
                    <p className="font-playfair text-lg text-royalGold">${item.price * item.quantity}</p>
                    <button onClick={() => removeFromCart(item.menuItemId)}
                      className="w-8 h-8 rounded-full bg-antiqueBronze/30 hover:bg-antiqueBronze/60 text-warmwhite text-xs flex items-center justify-center transition-colors">✕</button>
                  </div>
                ))
              )}
            </div>
            {cart.length > 0 && (
              <div className="p-6 border-t border-softBeige/10 space-y-4 bg-darkWalnut/80">
                <div className="flex items-center justify-between">
                  <span className="text-sm uppercase tracking-wider text-softBeige/70">Subtotal</span>
                  <span className="font-playfair text-2xl text-royalGold">${cartTotal}</span>
                </div>
                <button onClick={placeOrder}
                  className="w-full py-4 rounded-luxury font-semibold bg-gradient-to-r from-royalGold via-deepSaffron to-terracotta text-charcoal hover:shadow-luxury-lg hover:scale-[1.01] transition-all duration-300 text-base">
                  Place Order · ${cartTotal}
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* FOOTER */}
      <footer className="mt-20 border-t border-softBeige/10 py-10">
        <div className="max-w-7xl mx-auto px-4 md:px-8 text-center">
          <p className="font-playfair text-xl text-royalGold mb-2">Vibeathon Restro</p>
          <p className="text-xs text-softBeige/50">Modern Indian Luxury · Crafted for the Hackathon</p>
        </div>
      </footer>
    </div>
  );
}

const container = document.getElementById('__next');
const root = createRoot(container);
root.render(<App />);
})();
</script>
</body>
</html>
